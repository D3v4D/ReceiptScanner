spring:
  application:
    name: receipt-scanner
    version: 1.0.0

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax

  datasource:
    url: "jdbc:postgresql://localhost:5432/mydb"
    username: "admin"
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  session:
    timeout: 30m

python-service:
  base-url: ${PYTHON_SERVICE_BASE_URL:http://localhost:8000}
