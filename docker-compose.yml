services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  receipt-to-text-ms:
    build: receipt-to-text-ms
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: gemma3:4b
      LLM_TIMEOUT_SECONDS: "600"
      LLM_MAX_RETRIES: "1"
      PYTHONUNBUFFERED: "1"
      OCR_LANG: "hu"
    volumes:
      - ./receipt-to-text-ms:/app
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama:latest
    profiles:
      - llm
    gpus: all
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: ./receipt-scanner/
    depends_on:
      - db
      - receipt-to-text-ms
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mydb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      PYTHON_SERVICE_BASE_URL: http://receipt-to-text-ms:8000
    ports:
      - "8080:8080"

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./receipt-scanner-frontend:/app
    depends_on:
      - app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

volumes:
  pgdata: 
  ollama_data:
